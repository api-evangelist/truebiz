aid: truebiz
name: TrueBiz
description: >-
  TrueBiz automates merchant risk assessment by analyzing a business's internet
  footprint. Its Web Presence Review API scores a merchant's legitimacy and risk
  from a domain plus submitted business details, returning a rich Company profile
  with fraud-risk analysis, website content flags, customer reviews, connected
  people and entities, and domain/hosting intelligence. A Monitoring API watches
  domains continuously and raises alerts, and Blocklist, Industry Discovery, and
  Fraud Search endpoints round out the platform. Payments providers and financial
  institutions use TrueBiz to streamline underwriting and ongoing merchant due
  diligence. The REST API authenticates with an X-API-KEY header and is documented
  with an OpenAPI 3.0.2 specification.
