apis:
- aid: truebiz:truebiz-async-web-presence-review-api
  name: TrueBiz Async Web Presence Review API
  description: >-
    Web Presence Review endpoints allow you to provide information about a business for TrueBiz to review.
     We look at the content on the website, find social media profiles, review sites, and other
    broader web presence. For security reasons, any domain provided will be reduced to the registered
    domain known

    to Mozilla's Public Suffix List (e.g. https://www.bbc.co.uk/some/page -> bbc.co.uk). These endpoints
    will then

    review the web presence starting with the index page for that domain (e.g. bbc.co.uk -> https://bbc.co.uk/).


    This asynchronous endpoint allows you to submit a request to TrueBiz without having to wait for the
    response to

    complete. Your submission will instead get a response containing a brief message and a tracking ID.
    You may either

    poll for status updates using the url provided in the response's `Location` header, or, if you have

    a webhook configured, wait for us to notify you when the web presence review is completed. (You may
    then request

    the details from the Web Presence Review History endpoint.)
  humanURL: https://ae.truebiz.io/api/v1/docs
  baseURL: https://ae.truebiz.io
  tags:
  - Async Web Presence Review
  properties:
  - type: OpenAPI
    url: openapi/truebiz-async-web-presence-review-api-openapi.yml
  - type: APIReference
    url: https://ae.truebiz.io/api/v1/docs
  - type: Documentation
    url: https://docs.truebiz.io
