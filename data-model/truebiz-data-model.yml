notes: >-
  Entity-relationship graph derived from OpenAPI component schema $ref links.
  Company is the central aggregate returned by a Web Presence Review; a review
  is correlated to a caller request by request_id and optional external_tracking_ref.
  The review bundles a domain profile, risk analysis, website content, customer
  reviews, and website traffic as analysis sections.
entities:
