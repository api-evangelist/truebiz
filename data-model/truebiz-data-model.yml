identifiers:
  request_id: correlates an async review submission to its stored history record
  external_tracking_ref: caller-supplied reference echoed back for reconciliation
  search_id: identifies an industry-search or fraud-search job
  alert_id: identifies a monitoring alert
  domain: natural key for blocklist and monitoring resources
