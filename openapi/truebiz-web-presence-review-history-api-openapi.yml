          example:
            number: '+15558675309'
            is_valid: true
            line_type: Landline
            country_name: United States
            country_code: US
            links_to_company:
            - type: Direct
              duration: P2Y10M
          nullable: true
          strict: true
          allOf:
          - $ref: '#/components/schemas/Phone'
        additional_phone_numbers:
          title: Additional phone numbers
