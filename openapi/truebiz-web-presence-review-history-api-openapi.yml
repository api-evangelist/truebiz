          description: A domain that is known to be registered to a known hosting provider (e.g. company.hostingprovider.com and not company.com).
          example: false
          type: boolean
        is_non_business:
          title: Is non business?
          description: A domain with a top level domain that indicates it is unlikely to be a business (e.g. .edu, .gov).
          example: false
          type: boolean
        is_ssl_valid:
          title: Is SSL valid?
          description: A domain for which SSL was properly configured at the time of the check.
          example: true
          type: boolean
        is_webserver_responsive:
          title: Is webserver responsive?
          description: A domain for which the responding web server(s) responds to a simple HTTP or HTTPS request on port 80 or 443.
          example: true
          type: boolean
        screenshot:
          title: Screenshot
          description: Links to download a screenshot of the domain in multiple sizes.
          allOf:
          - $ref: '#/components/schemas/Screenshot'
        historical_archives:
          title: Historical archives
          description: Archives of the website from past dates.
          type: array
          items:
            $ref: '#/components/schemas/HistoricalArchive'
        registrar:
          title: Registrar
          description: Information about the domain's registrar
          allOf:
          - $ref: '#/components/schemas/Registrar'
        hosting_providers:
          title: Hosting providers
          description: Information about the host(s) of the webserver(s) used by the company's website
          example:
          - name: Google
            country: United States
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/HostingProvider'
        has_robots_txt:
          title: Has a valid robots.txt?
          description: A website sophistication signal that indicates content scraping permissibility.
          default: true
          example: true
          nullable: true
          type: boolean
        has_apex_and_www:
          title: Has apex and www?
          description: Indicates both the apex domain (e.g. example.com) and www subdomain (e.g. www.example.com) work or correctly forward traffic.
          default: true
          example: true
          nullable: true
          type: boolean
        estimated_tech_spend:
          title: Estimated tech spend
          description: An estimage of the monthly spend on website technologies derived from the visible premium libraries and tools.
          example: 1000
          nullable: true
          type: integer
        estimated_tech_spend_history:
          title: Estimated tech spend history
          description: Estimates of the monthly spend based on the website technologies used as times in the past.
          example:
          - spend: 850
            detected_date: '2022-06-01'
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/TechSpendRecord'
        website_tech_activity:
          title: Website tech activity
          description: The number of total, added, and removed website technologies by month.
          example:
          - year: 2023
            month: 6
            added: 4
            removed: 1
            total: 25
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/TechActivityMonth'
        domains_with_matching_credentials:
          title: Domains with matching credentials
          description: Domains that share technology credentials with the website.
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/CredentialMatchDomain'
        inbound_linking_domains_count:
          title: Inbound linking domains count
          description: The number of unique domains that have links to the website (aka backlinks).
          example: 5
          nullable: true
          type: integer
        inbound_redirects:
          title: Redirects
          description: A list of domains that redirect to the website.
          example:
          - example.xyz
          nullable: true
          type: array
          items:
            type: string
        cohosted_domains:
          title: Co-hosted domains
          description: A list of domains that are hosted on the same IP address as the website, and likely are owned or managed by the same entity.
          example:
          - example.xyz
          nullable: true
          type: array
          items:
            type: string
    NotFound:
      title: NotFound
      type: object
      properties:
        message:
          title: Message
          type: string
      required:
      - message
      example:
        message: Not found.
    DetectedBrand:
      title: DetectedBrand
      type: object
      properties:
        name:
          title: Brand Name
          description: The name of the brand.
          example: Nike
          type: string
        count:
          title: Frequency
          description: The number of times the brand name was detected in the company's principal page(s)
          example: 10
          type: integer
        action:
          title: Action
          description: The action that should be taken for the brand.
          example: warn
          type: string
      required:
      - name
      - count
      - action
    WebsiteTraffic:
      title: WebsiteTraffic
      type: object
      properties:
        visits_per_month:
          title: Visit per month
          description: The number of website visits in the last full month.
          example: 10000
          type: integer
        time_on_site:
          title: Time on site
          description: The average number of seconds a user spent on the site, during the last full month.
          example: 15.55
          type: number
        pages_per_visit:
          title: Pages per visit
          description: The average number of pages visited, during the last full month.
          example: 3.75
          type: number
        bounce_rate:
          title: Bounce rate
          description: The percentage of visitors that only visited a single page, during the last full month.
          example: 15.55
          type: number
        historical_visits_per_month:
          title: Historical visits per month
          description: The count of monthly visits over the prior few months.
          type: array
          items:
            $ref: '#/components/schemas/MonthlyVisits'
        source_shares:
          title: Source traffic share
          description: 'A mapping to the share of traffic by source: search, social, paid, direct, referrals, and mail.'
          allOf:
          - $ref: '#/components/schemas/TrafficSources'
        top_country_shares:
          title: Country traffic share
          description: A list of the top countries and their share of visits during the last full month.
          type: array
          items:
            $ref: '#/components/schemas/CountryShare'
        paid_search_share:
          title: Paid search share
          description: The percentage of search traffic that is paid.
          example: 0.5
          type: number
        google_results_count:
          title: Google results count
          description: The number of google results when searching for "example.com"
          example: 10000
          type: integer
        top_referring_sites:
          title: Top referring sites
          description: A list of sites referring at least 2.5% of total traffic
          example:
          - url: https://referrer.co
            traffic_share: 0.35
          type: array
          items:
            $ref: '#/components/schemas/ReferringSite'
        paid_search_visits:
          title: Paid search visits
          description: The number of visits coming from paid search ads, during the last full month.
          example: 1000
          type: integer
        top_keywords:
          title: Top keywords
          description: The top organic and paid keywords driving traffic to the site.
          allOf:
          - $ref: '#/components/schemas/TopKeywords'
        anomalous_keywords:
          title: Anomalous keywords
          description: A list of keywords that are not related to the business description.
          example:
          - firearms
          - gummy bears
          type: array
          items:
            type: string
    AverageEngagement:
      title: AverageEngagement
      description: An enumeration.
      enum:
      - Low
      - Medium
      - High
      type: string
  securitySchemes:
    AsyncApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
    AsyncPropelAuthBearer:
      type: http
      scheme: bearer
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
    PropelAuthBearer:
      type: http
      scheme: bearer
