          example:
          - number: '+15558675309'
            is_valid: true
            line_type: Landline
            country_name: United States
            country_code: US
            links_to_company:
            - type: Direct
              duration: P2Y10M
          nullable: true
          strict: true
          type: array
          items:
            $ref: '#/components/schemas/Phone'
        foot_traffic:
          title: Foot traffic
          description: Foot traffic data for the company.
          nullable: true
          allOf:
          - $ref: '#/components/schemas/FootTraffic'
        email_addresses:
          title: Email addresses
          description: Email addresses known to be associated with this company.
          default: []
          example:
          - address: partners@acme.com
            is_valid: true
          nullable: true
          strict: true
          type: array
          items:
            $ref: '#/components/schemas/Email'
        customer_reviews:
          title: Customer review
          description: Customer reviews data and analysis
          example:
            analysis:
              text: The company has a good reputation with customers.
              level_of_concern: low
              flags: []
            providers:
            - provider: yelp
              meta:
                url: https://www.yelp.com/biz/acme-anvil
                name: AcmeInc
                review_count: 3339
                review_average: 4.3
            - provider: google
              meta:
                url: https://www.google.com/maps/place/?q=place_id:ChIJE_P9I5yAhYARkssH6GvVJ2g
                name: Acme
                review_count: 11239
                review_average: 4.5
            - provider: trustpilot
              meta:
                url: https://www.trustpilot.com/review/www.acme.com
                name: Acme
                review_count: 22678
                review_average: 4.3
          nullable: true
          allOf:
          - $ref: '#/components/schemas/CustomerReviews'
        news_articles:
          title: News articles
          description: 'Recent news articles about the company filtered to risk-relevant themes only. Each article''s `concerns` field is tagged with one or more of: `Fraud`, `Legal`, or `Bankruptcy`. Articles that do not match any of these themes are not returned.'
          default: []
          example:
          - title: Acme, Inc. announces it is filing for bankruptcy.
            link: https://example.com/news/acme-inc-files-for-bankruptcy
            date: '2026-07-20T22:40:42.190Z'
            snippet: CEO Wiley E. Coyote announced that Acme, Inc. is filing for bankruptcy tomorrow at 9 AM.
            thumbnail: https://example.com/thumn/acme-vault-empty.png
            concerns:
            - Bankruptcy
          type: array
          items:
            $ref: '#/components/schemas/NewsArticle'
        social_media_profiles:
          title: Social media profile links
          description: All social media profile URLs we associate with the company. This is the complete set; `social_media_detailed_profiles` is the enriched subset of these for which we were able to collect follower counts and other per-profile metrics.
          default: []
          example:
          - https://facebook.com/acme
          - https://linkedin.com/company/acme-inc
          - https://crunchbase.com/organization/acme
          - https://twitter.com/acme
          - https://www.google.com/maps/place/?q=place_id:ChIJE_P9I5yAhYARkssH6GvVJ2g
          type: array
          items:
            type: string
        social_media_detailed_profiles:
          title: Detailed social media profiles
          description: 'Enriched per-profile data (follower counts, post recency, activity level, and where available, average audience engagement) for the subset of `social_media_profiles` we could collect detail for. Coverage varies by platform: Facebook, Instagram, LinkedIn, Twitter/X, Pinterest, TikTok, YouTube, and Snapchat are supported, but `activity_level` is only populated for Instagram and LinkedIn, and `average_engagement` only for Instagram.'
          default: []
          example:
          - url: https://facebook.com/acme
            follower_count: 22232239
            like_count: 22160933
            last_posted_content_at: '2023-07-01T10:23:00Z'
          type: array
          items:
            $ref: '#/components/schemas/SocialMediaProfile'
        metrics:
          title: Metrics
          description: Estimated company size and revenue, returned as bucketed ranges (not exact figures). Includes `estimated_employee_count_range` (e.g. `1-10`, `5,000+`) and `estimated_annual_revenue_range` (e.g. `0-1M`, `1B+`). Either sub-field may be absent if no source can estimate it.
          example:
            estimated_employee_count_range: 201-500
            estimated_annual_revenue_range: 10M-50M
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Metrics'
        people:
          title: People
          description: CXO-level executives and owners.
          default: []
          example:
          - name: Wiley E. Coyote
            job_title: Chief Executive Officer
            linkedin_url: https://www.linkedin.com/in/wiley-e-coyote/
            profile_picture: https://media.licdn.com/dms/image/D4D03AQGDnwFEps6idg/profile-displayphoto-shrink_200_200/0/1673360179524?e=1688601600&v=beta&t=bpXAkQdRR7liIMck3FQ7maRE-XeMwtChfWt73oB7YZ0
            state_province: California
            city: San Francisco
            country: United States
          type: array
          items:
            $ref: '#/components/schemas/Person'
        ecommerce:
          title: Ecommerce
          description: Metrics and information on the online store present at the website
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Ecommerce'
        connected_entities:
          title: Related entities
          description: Other entities discovered to be connected to this business. Each entity's `sources` list explains how the connection was established; possible source types include `Referring site`, `Duplicate website text`, `External email domain`, `Shared executive`, `Shared phone number`, `Shared credentials`, `Cohosted domain`, `Redirect domain`, `Searched domain redirects`, `Associated person`, `Phone owner`, `Shared address`, `Shared email`, and `Associated web page`.
          default: []
          example:
          - name: Roadrunner Restaurants
            domain: roadrunner-restaurants.com
            sources:
            - type: Shared address
              context: Both businesses are listed at 123 Main Street, Chicago, IL.
              url: https://roadrunner-restaurants.com
          type: array
          items:
            $ref: '#/components/schemas/ConnectedEntity'
        pdf_report_link:
          title: PDF report link
          description: Link to download a PDF outlining the results in a visual format.
          nullable: true
          minLength: 1
          maxLength: 65536
          format: uri
          type: string
        ui_portal_link:
          title: UI portal link
          description: Link to see the full response in TrueBiz's web portal.
          nullable: true
          minLength: 1
          maxLength: 65536
          format: uri
          type: string
        recommendation:
          title: Recommendation
          description: TrueBiz's overall opinion on whether this business passes review, derived from the risk indicators above. `decision` is one of `Pass` or `Fail`.
          example:
            decision: Pass
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Recommendation'
        risks:
          title: Risks
          description: 'All risk indicators evaluated for the business, partitioned into three buckets: `validity` (data points supporting legitimacy), `notice` (informational signals worth reviewing but not necessarily disqualifying), and `risk` (data points indicating risk from interacting with the business). The `recommendation` field summarizes the net verdict derived from these indicators.'
          default:
            validity: []
            notice: []
            risk: []
          example:
            validity:
            - category: business
              subcategory: classification
              name: is_industry_classified
              score: 10000
              description: Is TrueBiz able to find any supplemental data suggesting the business interacts in a high risk area?
              classification_type: Validity
            - category: business
              subcategory: classification
              name: is_no_classification_data_found
              score: 10000
              description: Is TrueBiz able to find any industry classification data for this business?
              classification_type: Validity
            - category: business
              subcategory: metadata
              name: is_founded_recently
              score: 10000
              description: Has the business been founded recently?
              classification_type: Validity
            - category: business
              subcategory: metrics
              name: is_company_size_and_revenue_metrics_aligned
              score: 10000
              description: Are the business metrics around employee count and revenue within expectations?
              classification_type: Validity
            - category: website
              subcategory: registration
              name: is_registered
              score: 10000
              description: Is the domain registered with a domain registrar?
              classification_type: Validity
            - category: website
              subcategory: registration
              name: is_registration_expired
              score: 10000
              description: Is the domain registration expired?
              classification_type: Validity
            - category: website
              subcategory: availability
              name: is_resolvable
              score: 10000
              description: Is the domain resolvable to an IP address?
              classification_type: Validity
            - category: website
              subcategory: availability
              name: is_webserver_responsive
              score: 10000
              description: Does the domain's responding web server(s) serve a simple HTTP or HTTPS request on port 80 or 443.
