          example: 1955
          nullable: true
          minimum: 578
          type: integer
        description:
          title: Description
          description: A short summary of what the company does, sourced from the company's own website content and/or third-party business data providers. May be `null` for parked, unreachable, or extremely sparse sites where no usable description could be derived.
          example: Acme, Inc. is a large manufacturing company best known for it's quality anvils.
          nullable: true
          minLength: 1
          maxLength: 65536
          type: string
        industry:
          title: Industry
